name: Publish And Release

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Compute next patch version
        id: version
        run: |
          LATEST=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            NEXT="v0.1.0"
          else
            VERSION="${LATEST#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next release: $NEXT"

      - name: Update package version files
        id: version_files
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          TARGET_VERSION="${VERSION#v}"
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=""
          echo "committed=false" >> "$GITHUB_OUTPUT"

          if [ -f package-lock.json ]; then
            LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          fi

          if [ "$CURRENT_VERSION" = "$TARGET_VERSION" ] && { [ -z "$LOCK_VERSION" ] || [ "$LOCK_VERSION" = "$TARGET_VERSION" ]; }; then
            echo "package.json (and package-lock.json, if present) is already at $CURRENT_VERSION; skipping version bump."
            exit 0
          fi

          npm version "$TARGET_VERSION" --no-git-tag-version --allow-same-version

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          if [ -f package-lock.json ]; then
            git add package-lock.json
          fi

          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          git commit -m "chore: bump version to ${VERSION#v} [skip ci]"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Verify package version has not been published
        id: preflight
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")

          if npm view "$PKG_NAME@$PKG_VERSION" version --registry=https://registry.npmjs.org > /dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION is already published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.preflight.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish --access public --provenance

      - name: Push version commit to main
        if: steps.version_files.outputs.committed == 'true'
        run: git push origin main

      - name: Create and push tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --latest
